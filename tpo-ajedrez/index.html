<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TPO Ajedrez - Juego Completo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2b2b2b;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 5px;
      color: #e0e0e0;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 20px;
    }

    .game-container {
      display: flex;
      gap: 30px;
      background: #3c3c3c;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 64px);
      grid-template-rows: repeat(8, 64px);
      border: 4px solid #1e1e1e;
      border-radius: 4px;
      user-select: none;
    }

    .square {
      width: 64px;
      height: 64px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 44px;
      cursor: pointer;
      position: relative;
    }

    .square.white {
      background-color: #eeeed2;
    }

    .square.black {
      background-color: #769656;
    }

    .square.selected {
      background-color: #baca44 !important;
    }

    .square.valid-move::after {
      content: '';
      width: 20px;
      height: 20px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
    }

    .square.valid-capture {
      background-color: #e66465 !important;
    }

    .controls {
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .status-card {
      background: #2b2b2b;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .turn-indicator {
      font-size: 18px;
      font-weight: bold;
      color: #4bacb5;
    }

    .alert {
      margin-top: 10px;
      padding: 8px;
      background-color: #d9534f;
      color: white;
      border-radius: 4px;
      font-weight: bold;
      display: none;
    }

    .btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .btn-secondary {
      background-color: #555;
    }

    .btn-secondary:hover {
      background-color: #666;
    }

    .history {
      background: #2b2b2b;
      padding: 10px;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      font-size: 13px;
    }

    .history-item {
      padding: 4px 0;
      border-bottom: 1px solid #444;
    }
  </style>
</head>
<body>

  <h1>TPO Ajedrez</h1>
  <div class="subtitle">Arquitectura Hexagonal — Núcleo Puro + Adaptador Web</div>

  <div class="game-container">
    <div class="board-container">
      <div id="board" class="board"></div>
    </div>

    <div class="controls">
      <div class="status-card">
        <div>Turno actual:</div>
        <div id="turn-indicator" class="turn-indicator">BLANCAS</div>
        <div id="check-alert" class="alert">¡JAQUE!</div>
      </div>

      <button id="undo-btn" class="btn btn-secondary">Deshacer Movimiento (Undo)</button>
      <button id="restart-btn" class="btn">Reiniciar Partida</button>

      <div>Historial de Jugadas:</div>
      <div id="history" class="history"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
